# Firefly Categorizer configuration
# These settings only take effect when the same environment variable is not set.
# Environment variables and .env entries still override config.yaml values.

firefly:
  # Base URL for your Firefly III instance (no trailing slash).
  url:

  # Personal Access Token from Firefly III (Profile -> OAuth).
  token:

  # Seconds to cache category list from Firefly III. 0 disables caching. Minimum: 0. Step: 0.01.
  categoriesTtl:

openai:
  # API key used for optional LLM fallback.
  apiKey:

  # Model name for the OpenAI-compatible client.
  model:

  # Override OpenAI base URL for compatible providers.
  baseUrl:

automation:
  # Confidence threshold (0-1). 0 disables auto-approve. Allowed range: 0 to 1. Step: 0.01.
  autoApproveThreshold:

  # Number of transactions fetched per training page. Minimum: 1.
  trainingPageSize:

  # Comma-separated tags applied on manual save.
  manualTags:

  # Comma-separated tags applied on auto-approve.
  autoApproveTags:

storage:
  # Directory for memory and model artifacts.
  dataDir:

  # Directory for application logs (app.log).
  logDir:

logging:
  # Logging verbosity for the application. Allowed values: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level:
